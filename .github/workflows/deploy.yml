name: Deploy to Beget VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-contact-magmahome
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build frontend & server bundles
        run: |
          npm run build
          npm run build:server

      - name: Check VPS SSH secrets
        id: check_secrets
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USERNAME: ${{ secrets.BEGET_USERNAME }}
          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          if [ -z "$BEGET_HOST" ] || [ -z "$BEGET_USERNAME" ] || [ -z "$BEGET_SSH_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets BEGET_HOST, BEGET_USERNAME, or BEGET_SSH_KEY are not set yet. Skipping VPS deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package release archive
        if: steps.check_secrets.outputs.configured == 'true'
        run: |
          tar -czf release.tar.gz dist dist-server package.json package-lock.json

      - name: Deploy release to Beget VPS
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USERNAME: ${{ secrets.BEGET_USERNAME }}
          BEGET_PORT: ${{ secrets.BEGET_PORT }}
          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          PORT="${BEGET_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$BEGET_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes "${BEGET_USERNAME}@${BEGET_HOST}" \
            "mkdir -p /var/www/contact.magmahome.ru"

          scp -i ~/.ssh/deploy_key -P "$PORT" -o StrictHostKeyChecking=yes \
            release.tar.gz "${BEGET_USERNAME}@${BEGET_HOST}:/var/www/contact.magmahome.ru/release.tar.gz"

          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes "${BEGET_USERNAME}@${BEGET_HOST}" '
            set -euo pipefail
            APP_DIR="/var/www/contact.magmahome.ru"
            STAGE_DIR="${APP_DIR}/release_stage"

            rm -rf "${STAGE_DIR}"
            mkdir -p "${STAGE_DIR}"
            tar -xzf "${APP_DIR}/release.tar.gz" -C "${STAGE_DIR}"
            rm -f "${APP_DIR}/release.tar.gz"

            cp -f "${STAGE_DIR}/package.json" "${APP_DIR}/package.json"
            cp -f "${STAGE_DIR}/package-lock.json" "${APP_DIR}/package-lock.json"

            NEW_SHA=$(sha256sum "${APP_DIR}/package-lock.json" | awk "{print \$1}")
            OLD_SHA=$(cat "${APP_DIR}/.lock_sha256" 2>/dev/null || echo "")

            if [ "${NEW_SHA}" != "${OLD_SHA}" ] || [ ! -d "${APP_DIR}/node_modules" ]; then
              echo "==> Dependencies changed or node_modules missing — running npm ci --omit=dev..."
              (cd "${APP_DIR}" && npm ci --omit=dev)
              echo "${NEW_SHA}" > "${APP_DIR}/.lock_sha256"
            else
              echo "==> package-lock.json unchanged — skipping npm ci."
            fi

            chmod 755 /var/www "${APP_DIR}"
            chmod -R a+rX "${STAGE_DIR}/dist"

            rm -rf "${APP_DIR}/dist_old" "${APP_DIR}/dist-server_old"
            if [ -d "${APP_DIR}/dist" ]; then mv "${APP_DIR}/dist" "${APP_DIR}/dist_old"; fi
            if [ -d "${APP_DIR}/dist-server" ]; then mv "${APP_DIR}/dist-server" "${APP_DIR}/dist-server_old"; fi

            mv "${STAGE_DIR}/dist" "${APP_DIR}/dist"
            mv "${STAGE_DIR}/dist-server" "${APP_DIR}/dist-server"
            rm -rf "${STAGE_DIR}" "${APP_DIR}/dist_old" "${APP_DIR}/dist-server_old"

            if systemctl is-enabled --quiet contact-magmahome-api.service 2>/dev/null; then
              systemctl restart contact-magmahome-api.service
            fi
          '
