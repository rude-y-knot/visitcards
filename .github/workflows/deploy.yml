name: Deploy to Beget VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-contact-magmahome
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build production bundle
        run: npm run build

      - name: Check VPS SSH secrets
        id: check_secrets
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USERNAME: ${{ secrets.BEGET_USERNAME }}
          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          if [ -z "$BEGET_HOST" ] || [ -z "$BEGET_USERNAME" ] || [ -z "$BEGET_SSH_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets BEGET_HOST, BEGET_USERNAME, or BEGET_SSH_KEY are not set yet. Skipping VPS deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy dist/ to Beget VPS (atomic swap)
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USERNAME: ${{ secrets.BEGET_USERNAME }}
          BEGET_PORT: ${{ secrets.BEGET_PORT }}
          BEGET_SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          PORT="${BEGET_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$BEGET_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$BEGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Pack dist/ and atomically replace /var/www/contact.magmahome.ru/dist on VPS
          tar -C dist -czf - . | ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes "${BEGET_USERNAME}@${BEGET_HOST}" '
            set -euo pipefail
            TARGET_DIR="/var/www/contact.magmahome.ru"
            TMP_DIR="${TARGET_DIR}/dist_new"
            OLD_DIR="${TARGET_DIR}/dist_old"

            mkdir -p "${TARGET_DIR}"
            rm -rf "${TMP_DIR}" "${OLD_DIR}"
            mkdir -p "${TMP_DIR}"
            tar -xzf - -C "${TMP_DIR}"
            chmod 755 /var/www "${TARGET_DIR}"
            chmod -R a+rX "${TMP_DIR}"

            if [ -d "${TARGET_DIR}/dist" ]; then
              mv "${TARGET_DIR}/dist" "${OLD_DIR}"
            fi
            mv "${TMP_DIR}" "${TARGET_DIR}/dist"
            rm -rf "${OLD_DIR}"
          '
